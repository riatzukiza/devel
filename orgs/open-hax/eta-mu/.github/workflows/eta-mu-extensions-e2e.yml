name: eta-mu-extensions-e2e

on:
  pull_request:
    paths:
      - 'packages/eta-mu-extensions/**'
      - 'packages/eta-mu-extensions-e2e/**'
      - '.github/workflows/eta-mu-extensions-e2e.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/eta-mu-extensions/**'
      - 'packages/eta-mu-extensions-e2e/**'
      - '.github/workflows/eta-mu-extensions-e2e.yml'

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.14.0'
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install workspace deps
        run: pnpm install --no-frozen-lockfile

      - name: Compile E2E tests
        working-directory: packages/eta-mu-extensions-e2e
        run: pnpm exec shadow-cljs --verbose compile e2e-test

      - name: Run E2E tests
        working-directory: packages/eta-mu-extensions-e2e
        run: node out/node-tests.cjs

      - name: Test summary
        if: always()
        working-directory: packages/eta-mu-extensions-e2e
        run: |
          echo '## E2E Test Results' >> $GITHUB_STEP_SUMMARY
          node out/node-tests.cjs 2>&1 | tee /tmp/e2e-output.txt || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/e2e-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload shadow-cljs logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shadow-cljs-logs
          path: packages/eta-mu-extensions-e2e/.shadow-cljs/
          if-no-files-found: ignore

      - name: Upload Clojure error reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-clojure-error-reports
          path: /tmp/clojure-*.edn
          if-no-files-found: ignore
