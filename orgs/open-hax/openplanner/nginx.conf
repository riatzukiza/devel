# OpenPlanner Horizontal Scaling — Nginx Load Balancer
#
# This config load-balances across multiple OpenPlanner containers.
# Docker Compose DNS round-robins the 'openplanner' hostname to all replicas.

upstream openplanner_backend {
    least_conn;
    server openplanner:7777;
}

server {
    listen 7777;
    listen [::]:7777;
    server_name _;

    # Match OpenPlanner's Fastify JSON bodyLimit so ingestion can POST
    # source-backed documents larger than nginx's 1m default.
    client_max_body_size 50m;

    location / {
        proxy_pass http://openplanner_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts: generous for long-running embedding jobs
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Buffering: disable for streaming responses if we add SSE later
        proxy_buffering off;
    }

    # Health check endpoint — nginx will get 200 from any healthy instance
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}