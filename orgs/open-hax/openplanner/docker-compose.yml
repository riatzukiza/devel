# OpenPlanner - Personal Data Lake
#
# Horizontal scaling: docker compose up -d --scale openplanner=3
# Nginx load-balances across all OpenPlanner replicas using least-connections.
#
# Storage backends:
#   - DuckDB (default): file-based, embedded
#   - MongoDB: scalable, shared with Cephalon Hive
#
# Set OPENPLANNER_STORAGE_BACKEND=mongodb to use MongoDB.

services:
  # OpenPlanner — horizontally scalable API workers.
  # Nginx handles load balancing across all replicas.
  # Change deploy.replicas below to scale.
  openplanner:
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      replicas: 3
    depends_on:
      mongodb:
        condition: service_healthy
        required: false
      mongot:
        condition: service_started
        required: false
      mongo-init:
        condition: service_completed_successfully
        required: false
    # No host port binding — accessed through nginx reverse proxy only.
    # This allows multiple replicas without port collisions.
    expose:
      - "7777"
    environment:
      NODE_ENV: production
      OPENPLANNER_HOST: 0.0.0.0
      OPENPLANNER_PORT: "7777"
      OPENPLANNER_API_KEY: "${OPENPLANNER_API_KEY:-change-me}"
      OPENPLANNER_DATA_DIR: /app/openplanner-lake
      # Storage backend: duckdb (default) or mongodb
      OPENPLANNER_STORAGE_BACKEND: "${OPENPLANNER_STORAGE_BACKEND:-duckdb}"
      # MongoDB configuration (used when STORAGE_BACKEND=mongodb)
      MONGODB_URI: "${MONGODB_URI:-mongodb://mongodb:27017/openplanner?replicaSet=rs0}"
      MONGODB_DB: "${MONGODB_DB:-openplanner}"
      MONGODB_EVENTS_COLLECTION: "${MONGODB_EVENTS_COLLECTION:-events}"
      MONGODB_COMPACTED_COLLECTION: "${MONGODB_COMPACTED_COLLECTION:-compacted_memories}"
      MONGODB_VECTOR_HOT_COLLECTION: "${MONGODB_VECTOR_HOT_COLLECTION:-event_chunks}"
      MONGODB_VECTOR_COMPACT_COLLECTION: "${MONGODB_VECTOR_COMPACT_COLLECTION:-compacted_vectors}"
      # TTL settings (seconds) - set to auto-expire old events
      # Recommended: 2592000 = 30 days, 7776000 = 90 days
      MONGODB_EVENTS_TTL_SECONDS: "${MONGODB_EVENTS_TTL_SECONDS:-0}"
      MONGODB_COMPACTED_TTL_SECONDS: "${MONGODB_COMPACTED_TTL_SECONDS:-0}"
      # Embedding provider (separate from Ollama — used by EmbedProviderFunction)
      EMBED_PROVIDER_BASE_URL: "${EMBED_PROVIDER_BASE_URL:-${OPENPLANNER_OLLAMA_BASE_URL:-http://proxx:8789}}"
      EMBED_PROVIDER_API_KEY: "${EMBED_PROVIDER_API_KEY:-${OPEN_HAX_OPENAI_PROXY_AUTH_TOKEN:-change-me-open-hax-proxy-token}}"
      EMBED_PROVIDER_MAX_BATCH_ITEMS: "${EMBED_PROVIDER_MAX_BATCH_ITEMS:-64}"
      # Qwen3-Embedding is instruction tuned; query-side instruction improves retrieval.
      EMBED_QUERY_PREFIX: "${EMBED_QUERY_PREFIX:-Instruct: Given a conversational memory search query, retrieve relevant OpenPlanner passages, Knoxx session memories, tool results, and decisions that answer the query.\\nQuery: }"
    volumes:
      - ./openplanner-lake:/app/openplanner-lake
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:7777/v1/health').then((response) => { if (!response.ok) { process.exit(1); } }).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      default: {}
      ai-infra: {}

  # Nginx reverse proxy — load balances across OpenPlanner replicas.
  # Uses least-connections for better distribution of long requests.
  nginx:
    image: nginx:alpine
    ports:
      - "${OPENPLANNER_PORT:-7777}:7777"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - openplanner
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7777/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      default: {}
      ai-infra: {}

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "${OPENPLANNER_CHROMA_PORT:-8000}:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
    volumes:
      - ./openplanner-lake/chroma:/chroma/chroma
    restart: unless-stopped

  # MongoDB self-managed vector search runtime (mongod + mongot)
  mongodb:
    image: mongodb/mongodb-community-server:8.2.0-ubi9
    command: ["mongod", "--replSet", "rs0"]
    ports:
      - "${OPENPLANNER_MONGODB_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: openplanner
    volumes:
      - openplanner-mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    profiles:
      - mongodb
    networks:
      default: {}
      ai-infra:
        aliases:
          - openplanner-mongodb

  mongot:
    image: mongodb/mongodb-community-search:0.53.1
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "${OPENPLANNER_MONGOT_PORT:-27028}:27028"
    restart: unless-stopped
    profiles:
      - mongodb
    networks:
      default: {}
      ai-infra: {}

  mongo-init:
    image: mongodb/mongodb-community-server:8.2.0-ubi9
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -lc
      - |
        mongosh --host mongodb --eval 'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongodb:27017" }] })' || true
    restart: "no"
    profiles:
      - mongodb
    networks:
      default: {}
      ai-infra: {}

  # One-shot Clojure worker: materialize historical graph.edge events into graph_edges.
  # Run with: docker compose --profile workers run --rm openplanner-graph-edges-backfill
  openplanner-graph-edges-backfill:
    build:
      context: ./packages/workers/kafka
      dockerfile: Dockerfile
    command:
      - sh
      - -lc
      - /opt/java/openjdk/bin/java ${JAVA_OPTS:--XX:TieredStopAtLevel=1} -cp "$(cat .cpcache/runtime.cp)" openplanner.kafka.jobs graph-edges-backfill
    depends_on:
      mongodb:
        condition: service_healthy
        required: false
    environment:
      MONGODB_URI: "${MONGODB_URI:-mongodb://mongodb:27017/openplanner?replicaSet=rs0}"
      MONGODB_DB: "${MONGODB_DB:-openplanner}"
      MONGODB_EVENTS_COLLECTION: "${MONGODB_EVENTS_COLLECTION:-events}"
      MONGODB_GRAPH_EDGES_COLLECTION: "${MONGODB_GRAPH_EDGES_COLLECTION:-graph_edges}"
      OPENPLANNER_GRAPH_EDGES_BACKFILL_LIMIT: "${OPENPLANNER_GRAPH_EDGES_BACKFILL_LIMIT:-0}"
      OPENPLANNER_GRAPH_EDGES_BACKFILL_BATCH_SIZE: "${OPENPLANNER_GRAPH_EDGES_BACKFILL_BATCH_SIZE:-1000}"
      OPENPLANNER_GRAPH_EDGES_BACKFILL_LOG_EVERY: "${OPENPLANNER_GRAPH_EDGES_BACKFILL_LOG_EVERY:-1000}"
    restart: "no"
    profiles:
      - workers
    networks:
      default: {}
      ai-infra: {}

  # Prometheus - metrics collection
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "${OPENPLANNER_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - openplanner-prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: unless-stopped
    profiles:
      - monitoring
    networks:
      default: {}
      ai-infra: {}

  # Grafana - metrics visualization
  grafana:
    image: grafana/grafana:latest
    ports:
      - "${OPENPLANNER_GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/openplanner-grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - openplanner-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    profiles:
      - monitoring
    networks:
      default: {}
      ai-infra: {}

volumes:
  openplanner-mongodb-data:
  openplanner-prometheus-data:
  openplanner-grafana-data:

networks:
  ai-infra:
    external: true
    name: ai-infra
